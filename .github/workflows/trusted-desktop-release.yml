name: Trusted Desktop Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  authorize-release:
    name: Authorize exact tagged main commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package_version: ${{ steps.release_guard.outputs.package_version }}
      publish_authorized: ${{ steps.release_guard.outputs.publish_authorized }}
      release_sha: ${{ steps.release_guard.outputs.release_sha }}
      release_tag: ${{ steps.release_guard.outputs.release_tag }}

    steps:
      - name: Checkout exact successful main CI commit and trusted refs
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm

      - name: Verify trusted release provenance and version
        id: release_guard
        env:
          RELEASE_DEFAULT_REF: ${{ github.ref }}
          RELEASE_DEFAULT_SHA: ${{ github.sha }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RELEASE_TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          RELEASE_TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: node scripts/verify-desktop-release-provenance.mjs

  build-windows-x64:
    name: Windows x64 package from authorized main commit
    needs: authorize-release
    if: needs.authorize-release.outputs.publish_authorized == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Production-v1 is intentionally unsigned. Never inherit a runner/user
      # certificate while the release path remains unsigned by product policy.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NSIS_SOURCE_COMMIT: ${{ needs.authorize-release.outputs.release_sha }}

    steps:
      - name: Checkout exact authorized main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.authorize-release.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Contract tests
        run: npm run test:contracts

      - name: Desktop contracts
        run: npm run test:desktop

      - name: Sandboxed preload integration smoke
        run: npm run test:desktop:integration

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Desktop and mobile E2E
        run: npm run test:e2e

      - name: Prepare desktop inputs
        run: npm run desktop:prepare

      - name: Build production-equivalent NSIS unpacked artifact
        run: npm run desktop:builder:nsis:unpacked

      - name: Build production NSIS installer
        run: npm run desktop:builder:nsis:bundle

      - name: NSIS production source contracts
        run: npm run test:desktop:builder:nsis:source

      - name: Generate NSIS production evidence
        run: npm run generate:desktop:builder:nsis:evidence

      - name: NSIS production artifact contracts
        run: npm run test:desktop:builder:nsis:artifact

      - name: Finalize and verify unsigned release artifact
        env:
          RELEASE_EXPECTED_PACKAGE_VERSION: ${{ needs.authorize-release.outputs.package_version }}
        run: node scripts/finalize-release-artifact.mjs

      - name: Upload exact-SHA workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: review-workspace-windows-x64-${{ needs.authorize-release.outputs.release_sha }}
          path: |
            out/release/ReviewWorkspace-${{ needs.authorize-release.outputs.package_version }}-Windows-x64-Setup.exe
            out/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft GitHub Release
    needs:
      - authorize-release
      - build-windows-x64
    if: needs.authorize-release.outputs.publish_authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout exact authorized commit for artifact verification
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.authorize-release.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 24.20.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm

      - name: Download exact-SHA release artifact
        uses: actions/download-artifact@v5
        with:
          name: review-workspace-windows-x64-${{ needs.authorize-release.outputs.release_sha }}
          path: out/release

      - name: Verify downloaded release artifact checksum
        env:
          RELEASE_EXPECTED_PACKAGE_VERSION: ${{ needs.authorize-release.outputs.package_version }}
        run: node scripts/verify-release-artifact.mjs

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installerName = "ReviewWorkspace-${{ needs.authorize-release.outputs.package_version }}-Windows-x64-Setup.exe"
          $notes = @"
          Windows x64 安装版。请运行 $installerName 完成安装或覆盖升级。

          不分发脱离 resources 目录无法独立运行的裸主程序。Windows SmartScreen 可能因当前版本未签名而提示未知发布者。
          "@
          gh release create "${{ needs.authorize-release.outputs.release_tag }}" "out/release/$installerName" "out/release/SHA256SUMS.txt" --draft --notes $notes --title "错题复盘 ${{ needs.authorize-release.outputs.release_tag }}"
