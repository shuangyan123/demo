name: Trusted Desktop Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  authorize-release:
    name: Authorize exact tagged main commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package_version: ${{ steps.release_guard.outputs.package_version }}
      publish_authorized: ${{ steps.release_guard.outputs.publish_authorized }}
      release_sha: ${{ steps.release_guard.outputs.release_sha }}
      release_tag: ${{ steps.release_guard.outputs.release_tag }}

    steps:
      - name: Checkout exact successful main CI commit and trusted refs
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify trusted release provenance and version
        id: release_guard
        env:
          RELEASE_DEFAULT_REF: ${{ github.ref }}
          RELEASE_DEFAULT_SHA: ${{ github.sha }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RELEASE_TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          RELEASE_TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: node scripts/verify-desktop-release-provenance.mjs

  build-windows-x64:
    name: Windows x64 package from authorized main commit
    needs: authorize-release
    if: needs.authorize-release.outputs.publish_authorized == 'true'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact authorized main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.authorize-release.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Contract tests
        run: npm run test:contracts

      - name: Desktop contracts
        run: npm run test:desktop

      - name: Sandboxed preload integration smoke
        run: npm run test:desktop:integration

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Desktop and mobile E2E
        run: npm run test:e2e

      - name: Make Windows installer
        run: npm run desktop:make

      - name: Packaged preload artifact regression
        run: npm run test:desktop:artifact

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $installerName = "ReviewWorkspace-$($package.version)-Windows-x64-Setup.exe"
          $installer = Get-ChildItem -LiteralPath "out\make" -Recurse -File -Filter $installerName | Select-Object -First 1
          if (-not $installer) { throw "Missing installer $installerName" }
          $releaseDirectory = New-Item -ItemType Directory -Force "out\release"
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $releaseDirectory $installerName)
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content -Encoding utf8 (Join-Path $releaseDirectory "SHA256SUMS.txt")

      - name: Upload exact-SHA workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: review-workspace-windows-x64-${{ needs.authorize-release.outputs.release_sha }}
          path: |
            out/release/ReviewWorkspace-${{ needs.authorize-release.outputs.package_version }}-Windows-x64-Setup.exe
            out/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft GitHub Release
    needs:
      - authorize-release
      - build-windows-x64
    if: needs.authorize-release.outputs.publish_authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download exact-SHA release artifact
        uses: actions/download-artifact@v5
        with:
          name: review-workspace-windows-x64-${{ needs.authorize-release.outputs.release_sha }}
          path: out/release

      - name: Verify release artifact boundary
        shell: pwsh
        run: |
          $installerName = "ReviewWorkspace-${{ needs.authorize-release.outputs.package_version }}-Windows-x64-Setup.exe"
          $expected = @($installerName, "SHA256SUMS.txt") | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath "out/release" -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            throw "Release artifact must contain exactly the installer and SHA256SUMS.txt"
          }

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installerName = "ReviewWorkspace-${{ needs.authorize-release.outputs.package_version }}-Windows-x64-Setup.exe"
          $notes = @"
          Windows x64 安装版。请运行 $installerName 完成安装或覆盖升级。

          不分发脱离 resources 目录无法独立运行的裸主程序。Windows SmartScreen 可能因当前版本未签名而提示未知发布者。
          "@
          gh release create "${{ needs.authorize-release.outputs.release_tag }}" "out/release/$installerName" "out/release/SHA256SUMS.txt" --draft --notes $notes --title "错题复盘 ${{ needs.authorize-release.outputs.release_tag }}"
