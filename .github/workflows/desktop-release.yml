name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      package_version: ${{ steps.release_guard.outputs.package_version }}
      publish_authorized: ${{ steps.release_guard.outputs.publish_authorized }}
      release_sha: ${{ steps.release_guard.outputs.release_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify release provenance and version
        id: release_guard
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/verify-desktop-release-provenance.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Contract tests
        run: npm run test:contracts

      - name: Desktop contracts
        run: npm run test:desktop

      - name: Sandboxed preload integration smoke
        run: npm run test:desktop:integration

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Desktop and mobile E2E
        run: npm run test:e2e

      - name: Make Windows installer
        run: npm run desktop:make

      - name: Packaged preload artifact regression
        run: npm run test:desktop:artifact

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $installerName = "ReviewWorkspace-$($package.version)-Windows-x64-Setup.exe"
          $installer = Get-ChildItem -LiteralPath "out\make" -Recurse -File -Filter $installerName | Select-Object -First 1
          if (-not $installer) { throw "Missing installer $installerName" }
          $releaseDirectory = New-Item -ItemType Directory -Force "out\release"
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $releaseDirectory $installerName)
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content -Encoding utf8 (Join-Path $releaseDirectory "SHA256SUMS.txt")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: review-workspace-windows-x64-${{ steps.release_guard.outputs.release_sha }}
          path: |
            out/release/ReviewWorkspace-${{ steps.release_guard.outputs.package_version }}-Windows-x64-Setup.exe
            out/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft GitHub Release
    needs: build-windows-x64
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.build-windows-x64.outputs.publish_authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download exact-SHA release artifact
        uses: actions/download-artifact@v5
        with:
          name: review-workspace-windows-x64-${{ needs.build-windows-x64.outputs.release_sha }}
          path: out/release

      - name: Verify release artifact boundary
        shell: pwsh
        run: |
          $installerName = "ReviewWorkspace-${{ needs.build-windows-x64.outputs.package_version }}-Windows-x64-Setup.exe"
          $expected = @($installerName, "SHA256SUMS.txt") | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath "out/release" -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            throw "Release artifact must contain exactly the installer and SHA256SUMS.txt"
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installerName = "ReviewWorkspace-${{ needs.build-windows-x64.outputs.package_version }}-Windows-x64-Setup.exe"
          $notes = @"
          Windows x64 安装版。请运行 $installerName 完成安装或覆盖升级。

          不分发脱离 resources 目录无法独立运行的裸主程序。Windows SmartScreen 可能因当前版本未签名而提示未知发布者。
          "@
          gh release create "${{ github.ref_name }}" "out/release/$installerName" "out/release/SHA256SUMS.txt" --draft --notes $notes --title "错题复盘 ${{ github.ref_name }}"
