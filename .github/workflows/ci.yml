name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  static:
    name: Type Check, ESLint, Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 固定官方 Node 22 LTS 环境，并复用 npm 下载缓存。
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Contract tests
        run: npm run test:contracts

      - name: M3 migration helper contracts
        run: npm run test:desktop:installer:m3

      - name: Desktop TypeScript
        run: npm run desktop:compile

      - name: Desktop contracts
        run: npm run test:desktop

  security:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:prod

  windows-m3:
    name: Windows M3 Migration Contracts
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      M3_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact PR head
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:M3_SOURCE_COMMIT) {
            throw "Checked out $head instead of exact PR head $env:M3_SOURCE_COMMIT"
          }

      - name: Setup Node 22.23.1
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: M3 migration helper contracts
        shell: pwsh
        run: |
          $output = @(& npm run test:desktop:installer:m3 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          $summary = $output -join "`n"
          if ($exitCode -ne 0) {
            throw "M3 contract command failed with exit code $exitCode"
          }
          if ($summary -notmatch '(?m)^\s*(?:ℹ\s+|#\s*)?fail\s+0\s*$') {
            throw "M3 contract summary did not prove fail = 0"
          }
          if ($summary -notmatch '(?m)^\s*(?:ℹ\s+|#\s*)?skipped\s+0\s*$') {
            throw "M3 contract summary did not prove skipped = 0"
          }

  build:
    name: Production Build
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle

      - name: Upload bundle budget
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-budget
          path: .next/diagnostics/bundle-budget.json
          if-no-files-found: error

  e2e:
    name: E2E (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - chromium-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e -- --project=${{ matrix.project }}

      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: .playwright-results
          if-no-files-found: ignore

  windows-nsis-m1:
    name: Windows NSIS Candidate
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # pull_request's github.sha is the synthetic merge ref; bind evidence to
      # the exact contributor head checked out below.
      M1_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
      # electron-builder 26.15.3 supports this boundary; M1 intentionally has
      # no certificate and must not discover a runner/user certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact PR head
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:M1_SOURCE_COMMIT) {
            throw "Checked out $head instead of exact PR head $env:M1_SOURCE_COMMIT"
          }

      - name: Setup Node 22.23.1
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Prepare desktop inputs
        run: npm run desktop:prepare

      - name: Build M1 unpacked candidate
        run: npm run desktop:builder:nsis:unpacked

      - name: Build bundled NSIS M1 candidate
        run: npm run desktop:builder:nsis:bundle

      - name: M1 source contracts
        run: npm run test:desktop:builder:nsis:source

      - name: Generate candidate evidence
        run: npm run generate:desktop:builder:nsis:evidence

      - name: M1 artifact contracts
        run: npm run test:desktop:builder:nsis:artifact

      - name: Upload private M1 candidate evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: review-workspace-nsis-m1-${{ github.event.pull_request.head.sha }}
          path: |
            out/builder-nsis/ReviewWorkspace-0.2.4-Windows-x64-NSIS-M1-Candidate.exe
            out/builder-nsis/candidate-evidence.json
          if-no-files-found: error
          retention-days: 7
