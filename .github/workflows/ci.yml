name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  private-release-checkout:
    name: Private release checkout contract
    if: github.event_name == 'pull_request'
    outputs:
      installer_sensitive: ${{ steps.classify.outputs.installer_sensitive }}
      migration_sensitive: ${{ steps.classify.outputs.migration_sensitive }}
      browser_runtime_sensitive: ${{ steps.classify.outputs.browser_runtime_sensitive }}
      windows_runtime_sensitive: ${{ steps.classify.outputs.windows_runtime_sensitive }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Authenticated full-history checkout without persisted credentials
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted refs are local and credentials are absent
        shell: bash
        run: |
          git rev-parse --verify 'refs/remotes/origin/main^{commit}'
          if git config --local --get-regexp '^http\..*\.extraheader$'; then
            echo 'checkout credential unexpectedly persisted in local Git config' >&2
            exit 1
          fi

      - name: Classify changed paths for heavyweight PR gates
        id: classify
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_paths="$(mktemp)"
          classification_output="$(mktemp)"
          classifier="$(mktemp --suffix=.mjs)"
          trap 'rm -f "$changed_paths" "$classification_output" "$classifier"' EXIT
          fail_safe() {
            printf '%s\n' \
              'installer_sensitive=true' \
              'migration_sensitive=true' \
              'browser_runtime_sensitive=true' \
              'windows_runtime_sensitive=true' >> "$GITHUB_OUTPUT"
          }
          if ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null || ! git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null; then
            fail_safe
          elif ! git diff --name-only --diff-filter=ACMRTUXBD -z "${PR_BASE_SHA}...${PR_HEAD_SHA}" > "$changed_paths"; then
            fail_safe
          # Execute the base-revision classifier so a PR cannot change its own gate policy.
          elif ! git show "${PR_BASE_SHA}:scripts/classify-ci-changes.mjs" > "$classifier" 2>/dev/null; then
            fail_safe
          elif ! node "$classifier" < "$changed_paths" > "$classification_output"; then
            fail_safe
          elif [ "$(wc -l < "$classification_output")" -ne 4 ] \
            || ! grep -Eq '^installer_sensitive=(true|false)$' "$classification_output" \
            || ! grep -Eq '^migration_sensitive=(true|false)$' "$classification_output" \
            || ! grep -Eq '^browser_runtime_sensitive=(true|false)$' "$classification_output" \
            || ! grep -Eq '^windows_runtime_sensitive=(true|false)$' "$classification_output"; then
            fail_safe
          else
            cat "$classification_output" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: Type Check, ESLint, Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 固定官方 Node 24.20.0 LTS 环境，并复用 npm 下载缓存。
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Contract tests
        run: npm run test:contracts

      - name: CI cost classification contracts
        run: node --test scripts/ci-cost-classification.contract.test.mjs

      - name: M3 migration helper contracts
        run: npm run test:desktop:installer:m3

      - name: Desktop TypeScript
        run: npm run desktop:compile

      - name: Desktop contracts
        run: npm run test:desktop

  security:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm
      - name: Audit production dependencies
        run: npm run audit:prod

  windows-m3:
    name: Windows M3 Migration Contracts
    needs: private-release-checkout
    if: github.event_name == 'pull_request' && always() && (needs.private-release-checkout.result != 'success' || needs.private-release-checkout.outputs.migration_sensitive != 'false')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      M3_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact PR head
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:M3_SOURCE_COMMIT) {
            throw "Checked out $head instead of exact PR head $env:M3_SOURCE_COMMIT"
          }

      - name: Setup Node 24.20.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: M3 migration helper contracts
        shell: pwsh
        run: |
          $output = @(& npm run test:desktop:installer:m3 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          $summary = $output -join "`n"
          if ($exitCode -ne 0) {
            throw "M3 contract command failed with exit code $exitCode"
          }
          if ($summary -notmatch '(?m)^\s*(?:ℹ\s+|#\s*)?fail\s+0\s*$') {
            throw "M3 contract summary did not prove fail = 0"
          }
          if ($summary -notmatch '(?m)^\s*(?:ℹ\s+|#\s*)?skipped\s+0\s*$') {
            throw "M3 contract summary did not prove skipped = 0"
          }

  build:
    name: Production Build
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle

      - name: Upload bundle budget
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-budget
          path: .next/diagnostics/bundle-budget.json
          if-no-files-found: error

  e2e:
    name: E2E (Chromium + Mobile)
    needs: [build, private-release-checkout]
    if: github.event_name == 'pull_request' && always() && needs.build.result == 'success' && (needs.private-release-checkout.result != 'success' || needs.private-release-checkout.outputs.browser_runtime_sensitive != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-linux
          path: .playwright-results
          include-hidden-files: true
          if-no-files-found: ignore

  windows-e2e:
    name: Windows Full E2E (Node 24.20.0)
    needs: private-release-checkout
    if: github.event_name == 'pull_request' && always() && (needs.private-release-checkout.result != 'success' || needs.private-release-checkout.outputs.windows_runtime_sensitive != 'false' || needs.private-release-checkout.outputs.installer_sensitive != 'false')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WINDOWS_E2E_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
      # The Windows runner uses PowerShell; this is the explicit CI=1 boundary
      # consumed by Playwright for the single-worker, CI reporter path.
      CI: "1"

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact PR head
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:WINDOWS_E2E_SOURCE_COMMIT) {
            throw "Checked out $head instead of exact PR head $env:WINDOWS_E2E_SOURCE_COMMIT"
          }

      - name: Setup Node 24.20.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Native first-profile startup regressions
        shell: pwsh
        run: |
          npm run desktop:compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --experimental-strip-types desktop/profile-native.contract.test.ts desktop/profile-runtime-readiness.contract.test.ts desktop/profile-initialization.contract.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Full E2E tests with CI=1
        shell: pwsh
        run: |
          if ($env:CI -ne "1") {
            throw "Windows full E2E must run with CI=1"
          }
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-windows
          path: .playwright-results
          include-hidden-files: true
          if-no-files-found: ignore

  windows-nsis-production:
    name: Windows NSIS Production
    needs: private-release-checkout
    if: github.event_name == 'pull_request' && always() && (needs.private-release-checkout.result != 'success' || needs.private-release-checkout.outputs.installer_sensitive != 'false')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # pull_request's github.sha is the synthetic merge ref; bind evidence to
      # the exact contributor head checked out below.
      NSIS_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
      # electron-builder 26.16.0 supports this boundary; production-v1 has no
      # certificate and must not discover a runner/user certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact PR head
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:NSIS_SOURCE_COMMIT) {
            throw "Checked out $head instead of exact PR head $env:NSIS_SOURCE_COMMIT"
          }

      - name: Setup Node 24.20.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Prepare desktop inputs
        run: npm run desktop:prepare

      - name: Build production-equivalent NSIS unpacked artifact
        run: npm run desktop:builder:nsis:unpacked

      - name: Build production NSIS installer
        run: npm run desktop:builder:nsis:bundle

      - name: NSIS production source contracts
        run: npm run test:desktop:builder:nsis:source

      - name: Generate NSIS production evidence
        run: npm run generate:desktop:builder:nsis:evidence

      - name: NSIS production artifact contracts
        run: npm run test:desktop:builder:nsis:artifact

      - name: Finalize and verify unsigned release artifact
        run: node scripts/finalize-release-artifact.mjs

      - name: Upload private finalized NSIS release artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: review-workspace-nsis-final-${{ github.event.pull_request.head.sha }}
          path: |
            out/release/ReviewWorkspace-0.3.1-Windows-x64-Setup.exe
            out/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload private NSIS production evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: review-workspace-nsis-production-${{ github.event.pull_request.head.sha }}
          path: |
            out/builder-nsis/ReviewWorkspace-0.3.1-Windows-x64-Setup.exe
            out/builder-nsis/production-evidence.json
          if-no-files-found: error
          retention-days: 7
